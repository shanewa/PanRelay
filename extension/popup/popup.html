<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>度盘接力存</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <img class="brand-logo" src="../icons/icon48.png" alt="" width="28" height="28" />
      <h1>度盘接力存</h1>
      <span class="brand-tag">完全免费</span>
    </header>

    <section id="unlockGate" class="card unlock-gate" hidden>
      <div class="unlock-qr-col">
        <img
          class="oa-qr"
          id="oaQr"
          src="../assets/wechat-oa-qr.jpg"
          alt="公众号二维码"
          title="点击放大"
        />
        <p class="hint">微信扫一扫，或保存后扫码</p>
      </div>
      <div class="unlock-form-col">
        <h2>关注公众号解锁</h2>
        <p class="hint">插件免费。关注后遇到问题可以直接给作者发消息。</p>
        <ol class="unlock-steps">
          <li>微信扫码关注公众号</li>
          <li>发送 <strong id="unlockKeyword">百度网盘插件</strong></li>
          <li>把回复里的 6 位数字填到下面</li>
        </ol>
        <input
          type="text"
          id="unlockCode"
          inputmode="numeric"
          maxlength="12"
          placeholder="6 位解锁码"
          autocomplete="off"
          aria-label="解锁码"
        />
        <button type="button" class="unlock-btn" id="unlockBtn">解锁</button>
        <p class="unlock-msg" id="unlockMsg" hidden></p>
      </div>
    </section>

    <div id="settingsRoot" class="settings">
      <section class="card feature">
        <label class="card-head">
          <h2>接力转存</h2>
          <input type="checkbox" class="switch" id="enabled" aria-label="启用接力转存" />
        </label>
        <div class="card-body">
          <label class="field">
            <span>每批文件数</span>
            <input type="number" id="batchSize" min="50" max="500" step="50" />
          </label>
          <label class="field">
            <span>小批量也走接力</span>
            <input type="checkbox" class="switch switch-sm" id="alwaysRelay" />
          </label>
          <label class="field field-stack">
            <span class="field-line">
              <span>转存间隔</span>
              <span class="num"><strong id="cooldownLabel">1500</strong> ms</span>
            </span>
            <input type="range" id="transferCooldownMs" min="800" max="6000" step="100" />
          </label>
          <p class="hint">间隔越大越不容易被限流，但会更慢。免费账号每次最多约 500 个文件。</p>
        </div>
      </section>

      <section class="card feature speed-card">
        <label class="card-head">
          <h2>视频倍速</h2>
          <input type="checkbox" class="switch" id="videoSpeedEnabled" aria-label="启用视频倍速" />
        </label>
        <div class="card-body">
          <div class="speed-readout" aria-live="polite">
            <strong id="speedLabel">1.0</strong><span class="speed-x">×</span>
          </div>
          <input type="range" id="videoSpeed" min="0" max="1000" step="1" value="500" aria-label="播放速度" />
          <div class="speed-steps" id="speedStepRow" title="细调步进 0.01 / 0.1"></div>
          <div class="presets" id="speedPresets"></div>
          <label class="field">
            <span>保持音调</span>
            <input type="checkbox" class="switch switch-sm" id="preservePitch" checked />
          </label>
        </div>
      </section>

      <label class="card feature note-strip">
        <h2>视频笔记下载</h2>
        <span class="hint">在播放页增加「下载MD」按钮，下载 Markdown 格式的视频 AI 图文笔记。</span>
        <input
          type="checkbox"
          class="switch"
          id="noteMdExportEnabled"
          checked
          aria-label="显示下载MD按钮"
        />
      </label>
    </div>

    <footer class="foot">
      <button type="button" class="linklike" id="contactLink">联系作者 / 反馈问题</button>
    </footer>

    <div class="overlay" id="contactOverlay" hidden>
      <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="contactTitle">
        <button type="button" class="overlay-close" id="contactClose" aria-label="关闭">×</button>
        <h2 id="contactTitle">联系作者</h2>
        <img class="oa-qr" src="../assets/wechat-oa-qr.jpg" alt="公众号二维码" />
        <p class="hint">微信扫一扫关注公众号，直接给作者发消息</p>
      </div>
    </div>
    <script src="../lib/unlock.js"></script>
    <script src="../lib/media-speed.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
